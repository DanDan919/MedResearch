name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Generate API types
        working-directory: frontend
        run: pnpm api:generate

      - name: Verify generated API types are committed
        run: git diff --exit-code -- frontend/packages/api/src/generated/medresearch-api.ts

      - name: Lint frontend
        working-directory: frontend
        run: pnpm lint

      - name: Typecheck frontend
        working-directory: frontend
        run: pnpm typecheck

      - name: Test frontend
        working-directory: frontend
        run: pnpm test

      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright browser tests
        working-directory: frontend
        run: pnpm test:e2e

      - name: Build web frontend
        working-directory: frontend
        run: pnpm build

      - name: Build desktop React shell
        working-directory: frontend
        run: pnpm --filter @medresearch/desktop vite:build

  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      MEDRESEARCH_REQUIRE_DOCKER_TESTS: true
      TESTCONTAINERS_RYUK_DISABLED: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Docker info
        run: docker info

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore MedResearch.slnx

      - name: Build
        run: dotnet build MedResearch.slnx --configuration Release --no-restore

      - name: Test
        shell: pwsh
        run: |
          $testExitCode = 0
          $testProjects = @(
            @{ Name = 'Domain'; Path = 'tests/MedResearch.Domain.Tests/MedResearch.Domain.Tests.csproj' },
            @{ Name = 'Application'; Path = 'tests/MedResearch.Application.Tests/MedResearch.Application.Tests.csproj' },
            @{ Name = 'Infrastructure'; Path = 'tests/MedResearch.Infrastructure.Tests/MedResearch.Infrastructure.Tests.csproj' },
            @{ Name = 'Integration'; Path = 'tests/MedResearch.IntegrationTests/MedResearch.IntegrationTests.csproj' }
          )

          foreach ($project in $testProjects) {
            $resultsDirectory = Join-Path 'TestResults' $project.Name
            dotnet test $project.Path --configuration Release --no-build --logger "trx;LogFileName=$($project.Name).trx" --results-directory $resultsDirectory
            if ($LASTEXITCODE -ne 0) {
              $testExitCode = $LASTEXITCODE
            }
          }

          function Escape-Annotation([string] $value) {
            return $value.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          }

          Get-ChildItem -Path TestResults -Recurse -Filter *.trx | Sort-Object FullName | ForEach-Object {
            $trxPath = $_.FullName
            $counters = Select-Xml -Path $trxPath -XPath "//*[local-name()='Counters']" | Select-Object -First 1
            if ($counters -ne $null) {
              $node = $counters.Node
              $total = [int] $node.total
              $executed = [int] $node.executed
              $skipped = [Math]::Max([int] $node.notExecuted, $total - $executed)
              $counterMessage = "total=$total executed=$executed passed=$($node.passed) failed=$($node.failed) skipped=$skipped"
              Write-Host "TRX $($_.Name): $counterMessage"
              Write-Host "::notice title=TRX $($_.Name)::$counterMessage"

              if ($env:MEDRESEARCH_REQUIRE_DOCKER_TESTS -eq 'true' -and $skipped -gt 0) {
                Write-Host "::error title=Unexpected skipped tests::$($_.Name) reported $skipped skipped tests while MEDRESEARCH_REQUIRE_DOCKER_TESTS=true"
                $testExitCode = 1
              }
            }

            Select-Xml -Path $trxPath -XPath "//*[local-name()='UnitTestResult' and @outcome='Failed']" | ForEach-Object {
              $node = $_.Node
              $message = $node.Output.ErrorInfo.Message
              if ([string]::IsNullOrWhiteSpace($message)) {
                $message = $node.Output.ErrorInfo.StackTrace
              }

              $title = Escape-Annotation $node.testName
              $body = Escape-Annotation $message
              Write-Host "::error title=$title::$body"
            }
          }

          exit $testExitCode

      - name: Verify EF model has no pending migration
        run: dotnet ef migrations has-pending-model-changes --configuration Release --project src/MedResearch.Infrastructure/MedResearch.Infrastructure.csproj --startup-project src/MedResearch.Api/MedResearch.Api.csproj

      - name: Validate Docker Compose
        run: docker compose config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
