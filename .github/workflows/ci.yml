name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      MEDRESEARCH_REQUIRE_DOCKER_TESTS: true
      TESTCONTAINERS_RYUK_DISABLED: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Docker info
        run: docker info

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore MedResearch.slnx

      - name: Build
        run: dotnet build MedResearch.slnx --configuration Release --no-restore

      - name: Test
        shell: pwsh
        run: |
          dotnet test MedResearch.slnx --configuration Release --no-build --logger trx --results-directory TestResults
          $testExitCode = $LASTEXITCODE

          function Escape-Annotation([string] $value) {
            return $value.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          }

          Get-ChildItem -Path TestResults -Recurse -Filter *.trx | ForEach-Object {
            $trxPath = $_.FullName
            $counters = Select-Xml -Path $trxPath -XPath "//*[local-name()='Counters']" | Select-Object -First 1
            if ($counters -ne $null) {
              $node = $counters.Node
              $counterMessage = "total=$($node.total) executed=$($node.executed) passed=$($node.passed) failed=$($node.failed) skipped=$($node.notExecuted)"
              Write-Host "TRX $($_.Name): $counterMessage"
              Write-Host "::notice title=TRX $($_.Name)::$counterMessage"

              if ($env:MEDRESEARCH_REQUIRE_DOCKER_TESTS -eq 'true' -and [int] $node.notExecuted -gt 0) {
                Write-Host "::error title=Unexpected skipped tests::$($_.Name) reported $($node.notExecuted) skipped tests while MEDRESEARCH_REQUIRE_DOCKER_TESTS=true"
                $testExitCode = 1
              }
            }

            Select-Xml -Path $trxPath -XPath "//*[local-name()='UnitTestResult' and @outcome='Failed']" | ForEach-Object {
              $node = $_.Node
              $message = $node.Output.ErrorInfo.Message
              if ([string]::IsNullOrWhiteSpace($message)) {
                $message = $node.Output.ErrorInfo.StackTrace
              }

              $title = Escape-Annotation $node.testName
              $body = Escape-Annotation $message
              Write-Host "::error title=$title::$body"
            }
          }

          exit $testExitCode

      - name: Verify EF model has no pending migration
        run: dotnet ef migrations has-pending-model-changes --configuration Release --project src/MedResearch.Infrastructure/MedResearch.Infrastructure.csproj --startup-project src/MedResearch.Api/MedResearch.Api.csproj

      - name: Validate Docker Compose
        run: docker compose config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
