services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medresearch}
      POSTGRES_USER: ${POSTGRES_USER:-medresearch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medresearch_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - medresearch-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/MedResearch.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__MedResearch: Host=postgres;Port=5432;Database=${POSTGRES_DB:-medresearch};Username=${POSTGRES_USER:-medresearch};Password=${POSTGRES_PASSWORD:-medresearch_dev_password}
      Database__ApplyMigrationsOnStartup: "true"
      ResearchProcessing__Enabled: "true"
      ResearchProcessing__IdleDelayMilliseconds: "1000"
      ResearchProcessing__LeaseDurationSeconds: ${RESEARCH_PROCESSING_LEASE_DURATION_SECONDS:-900}
      ResearchProcessing__HeartbeatIntervalSeconds: ${RESEARCH_PROCESSING_HEARTBEAT_INTERVAL_SECONDS:-60}
      AI__Provider: OpenAI
      AI__BaseUrl: https://api.openai.com/v1/
      AI__Model: ${OPENAI_MODEL:-}
      AI__ApiKey: ${OPENAI_API_KEY:-}
      AI__TimeoutSeconds: "30"
      AI__MaxOutputTokens: "2000"
      EvidenceExtraction__MaxStudiesPerRun: ${EVIDENCE_EXTRACTION_MAX_STUDIES_PER_RUN:-10}
      EvidenceEvaluation__MaxStudiesPerRun: ${EVIDENCE_EVALUATION_MAX_STUDIES_PER_RUN:-10}
      Synthesis__MaxStudies: ${SYNTHESIS_MAX_STUDIES:-10}
      Synthesis__MaxEvidenceFindings: ${SYNTHESIS_MAX_EVIDENCE_FINDINGS:-40}
      Synthesis__MaxClaims: ${SYNTHESIS_MAX_CLAIMS:-12}
      PubMed__Enabled: ${PUBMED_ENABLED:-true}
      PubMed__BaseUrl: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/
      PubMed__MaxResultsPerQuery: ${PUBMED_MAX_RESULTS_PER_QUERY:-10}
      PubMed__TimeoutSeconds: "15"
      PubMed__Tool: MedResearch
      PubMed__Email: ${PUBMED_EMAIL:-}
      PubMed__ApiKey: ${PUBMED_API_KEY:-}
      PubMed__MaxRequestsPerSecond: ${PUBMED_MAX_REQUESTS_PER_SECOND:-2}
      PubMed__FetchBatchSize: ${PUBMED_FETCH_BATCH_SIZE:-25}
      PubMed__MaxRetryAttempts: ${PUBMED_MAX_RETRY_ATTEMPTS:-2}
      PubMed__RetryBaseDelayMilliseconds: ${PUBMED_RETRY_BASE_DELAY_MILLISECONDS:-250}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  medresearch-postgres-data:
